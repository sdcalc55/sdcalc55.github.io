name: Deploy SD Calculator to GitHub Pages

# Deploy the production main branch to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Automated tests
        run: npm test

      - name: Build static site
        run: NEXT_PUBLIC_BUILD_ID="${GITHUB_SHA::7}" NEXT_PUBLIC_BUILD_DATETIME="$(TZ=Asia/Omsk date '+%d.%m.%Y %H:%M (Омск, UTC+6)')" npm run build
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ''

      - name: Confirm static output exists
        run: test -f out/index.html

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
