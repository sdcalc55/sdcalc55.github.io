name: Build Windows portable launcher

on:
  push:
    branches:
      - windows-single-instance-prototype
    paths:
      - "windows-launcher/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $source = "windows-launcher/SDCalculatorLauncher.cpp"
          $output = "artifacts/SD-Calculator-Launcher.exe"
          $vswhere = "${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio C++ Build Tools not found" }
          $vcvars = Join-Path $vs "VC\\Auxiliary\\Build\\vcvars64.bat"
          $cmd = "`"$vcvars`" >nul && cl /nologo /std:c++17 /O2 /MT /DUNICODE /D_UNICODE `"$source`" /link /SUBSYSTEM:WINDOWS /OUT:`"$output`" Shell32.lib Shlwapi.lib Advapi32.lib"
          cmd.exe /c $cmd
          if ($LASTEXITCODE -ne 0) { throw "C++ build failed: $LASTEXITCODE" }
          Get-Item $output | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: SD-Calculator-Windows-Portable
          path: artifacts/SD-Calculator-Launcher.exe
          retention-days: 30
